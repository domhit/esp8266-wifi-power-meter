; PlatformIO Project Configuration File
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = esp12f
description = Firmware for ESP8266 gas meter

[common]
firmware_version = "242.1g"
upload_speed = 460800
monitor_speed = 115200
port = /dev/tty.wchusbserial1410
lib_deps_builtin =
lib_deps_all =
    arduinojson = ArduinoJson@>=6
    mqtt = PubSubClient
    eeprom = EEPROM_Rotate
    webserver = ESP8266WebServer
    wifimanager = WiFiManager
    mavg = movingAvg
build_flags =
    '-DFIRMWARE_VERSION=${common.firmware_version}'

[env:d1_mini]
platform = espressif8266
board = d1_mini
framework = arduino
build_flags = ${common.build_flags}
lib_deps = ${common.lib_deps_all}

[env:esp12f]
platform = espressif8266
board = esp12e
framework = arduino
build_flags = ${common.build_flags}
lib_deps = ${common.lib_deps_all}